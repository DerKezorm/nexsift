# Second opinion next to a local scanner that runs in the git hooks and is not
# part of the repository.
#
# Everything here is an allowlist. Nothing is switched off: a rule that fires
# on made-up data on every push is a rule somebody stops reading, and then the
# one real finding goes past unnoticed.

[extend]
useDefault = true

[allowlist]
description = "Placeholders and made-up data that are meant to be read."
paths = [
  '''package-lock\.json''',
  '''\.svg$''',
  '''\.png$''',
  '''\.ico$''',
  '''\.woff2$''',
]
regexes = [
  # The reserved documentation domain.
  '''example\.(com|org|net)''',
  # The characters source tokens are drawn from (backend/app/services/sources.py), without the ones that look
  # alike. A list of letters, not a key.
  '''^ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789$''',
  # The authentication secret of the worked example in RFC 8291, section 5 (backend/tests/test_webpush.py checks
  # the encryption against it). Printed in the standard, not a secret.
  '''^BTBZMqHH6r4Tts7J_aSIgg$''',
]
